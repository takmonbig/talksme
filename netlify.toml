[build]
  base = "frontend"
  command = "yarn build"
  publish = "dist"

# Proxy API calls to the FastAPI backend (set BACKEND_ORIGIN in Netlify env; never put secrets in frontend code).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-ORIGIN/api/:splat"
  status = 200
  force = true

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
